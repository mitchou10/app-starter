title = "app-starter gitleaks config"

# `targetRules` on a global allowlist needs v8.25.0.
minVersion = "v8.25.0"

[extend]
useDefault = true

# Allowlisting by rule + path is SHA-independent: a gitleaks git-mode fingerprint is `<commit>:<file>:<rule>:<line>`,
# so one kept in a `.gitleaksignore` is orphaned by every rebase, amend or squash of the branch carrying the line.
[[allowlists]]
targetRules = ["curl-auth-header"]
description = "The example of an emitting application in the README, with the development key of the compose file."
paths = ['''^README\.md$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "The fake API keys of the notification tests: they open nothing."
paths = ['''^backend/tests/notifications/helpers\.py$''']
