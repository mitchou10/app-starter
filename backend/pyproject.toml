[project]
name = "app-backend"
version = "0.3.0"
description = "Backend of the app"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.4",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "eralchemy>=1.7.0",
    "graphviz>=0.21",
    "moto[s3,server]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio support runs the code in greenlets: without this, the lines after the first await are not seen.
concurrency = ["thread", "greenlet"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80
